- name: Install HAProxy
  ansible.builtin.dnf:
    name: haproxy
    state: present

- name: Allow HAProxy to connect to the API port with SELinux enforcing (week1 README step 24)
  ansible.posix.seboolean:
    name: haproxy_connect_any
    state: true
    persistent: true

- name: Write HAProxy config (validated with haproxy -c before install)
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    validate: haproxy -c -f %s
  notify: Restart HAProxy

- name: Enable and start HAProxy
  ansible.builtin.systemd_service:
    name: haproxy
    enabled: true
    state: started
